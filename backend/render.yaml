services:
  - type: web
    name: helloto-backend
    runtime: node
    plan: free
    rootDir: backend

    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: HOST
        value: 0.0.0.0

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        value: file:./prisma/helloto.db

      - key: CORS_ORIGIN
        value: https://helloto-frontend.onrender.com

      - key: OTP_REAL_DELIVERY_ONLY
        value: "false"